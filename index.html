<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A map game for learning US area codes region by region.">
<title>Area Code Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a switchboard console. Map fills the left, the call card sits right; on phones the card stacks above the map. */
:root {
  --bg: #e9eeea;
  --panel: #fbfcfa;
  --ink: #13221d;
  --muted: #56675f;
  --rule: #cdd8d1;
  --land: #c3d3ca;
  --land-hover: #9fb9ab;
  --border: #f7faf8;
  --edge: #7f9a8c;
  --accent: #f0b100;
  --accent-ink: #2a1f00;
  --good: #1d8656;
  --bad: #c43d2b;
  --key: #13221d;
  --key-ink: #f4f7f5;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1513; --panel: #15201c; --ink: #e5eee9; --muted: #8ea29a; --rule: #263631;
    --land: #2b3d37; --land-hover: #3e5850; --border: #0e1513; --edge: #587a6f;
    --accent: #f4c13a; --accent-ink: #231a00; --good: #3cc386; --bad: #ef6b58;
    --key: #e5eee9; --key-ink: #0e1513;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1513; --panel: #15201c; --ink: #e5eee9; --muted: #8ea29a; --rule: #263631;
  --land: #2b3d37; --land-hover: #3e5850; --border: #0e1513; --edge: #587a6f;
  --accent: #f4c13a; --accent-ink: #231a00; --good: #3cc386; --bad: #ef6b58;
  --key: #e5eee9; --key-ink: #0e1513;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 4vw, 40px); line-height: 1; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
h1 span { color: var(--muted); font-weight: 600; }
.sub { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }
.tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--rule); border-radius: 999px; padding: 4px; flex-wrap: wrap; }
.tabs button { border: 0; background: transparent; color: var(--ink); font: 600 14px var(--font-body); padding: 8px 14px; border-radius: 999px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--key); color: var(--key-ink); }
button:focus-visible, .seg button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.board { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
@media (max-width: 860px) { .board { grid-template-columns: minmax(0, 1fr); } .card { order: -1; } }

.mapbox { background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; padding: 10px; min-width: 0; position: relative; }
svg.map { display: block; width: 100%; height: auto; }
.rg path { fill: var(--land); cursor: pointer; transition: fill .15s; }
.rg:hover path { fill: var(--land-hover); }
.rg.target path, .rg.sel path { fill: var(--accent); }
.rg.good path { fill: var(--good); }
.rg.bad path { fill: var(--bad); }
.rg.done path { fill: color-mix(in srgb, var(--good) 40%, var(--land)); }
.so { fill: none; stroke: var(--border); stroke-width: 1.3; stroke-linejoin: round; pointer-events: none; vector-effect: non-scaling-stroke; }
.ed { fill: none; stroke: var(--edge); stroke-width: .9; stroke-dasharray: 3 2.5; pointer-events: none; vector-effect: non-scaling-stroke; }
svg.zoomed .call:not(.terr) { display: none; }
.zoom { position: absolute; top: 12px; left: 12px; display: flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--panel); z-index: 1; }
.zoom button { border: 0; background: transparent; color: var(--ink); font: 600 12px var(--font-body); padding: 6px 10px; cursor: pointer; }
.zoom button[aria-pressed="true"] { background: var(--key); color: var(--key-ink); }
.others { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; max-height: 260px; overflow: auto; }
.others button { width: 100%; text-align: left; display: flex; gap: 10px; align-items: baseline; border: 0; border-radius: 6px; background: transparent; color: var(--ink); font: 500 13px var(--font-body); padding: 5px 6px; cursor: pointer; }
.others button:hover { background: var(--bg); }
.others code { font: 600 13px var(--font-mono); min-width: 7ch; }
.call rect { fill: var(--panel); stroke: var(--rule); cursor: pointer; }
.call text { font: 600 13px var(--font-mono); fill: var(--ink); pointer-events: none; }
.call line { stroke: var(--muted); stroke-width: .8; }
.call:hover rect { stroke: var(--ink); }
.call.good rect { fill: var(--good); stroke: var(--good); } .call.good text { fill: #fff; }
.call.bad rect { fill: var(--bad); stroke: var(--bad); } .call.bad text { fill: #fff; }
.call.target rect, .call.sel rect { fill: var(--accent); stroke: var(--accent); } .call.target text, .call.sel text { fill: var(--accent-ink); }
.tip { position: absolute; pointer-events: none; background: var(--key); color: var(--key-ink); font: 600 12px var(--font-body); padding: 4px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -130%); }

.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; padding: 18px; display: grid; gap: 16px; min-width: 0; }
.label { font: 600 11px var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; }
.meta { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.meta div { display: grid; gap: 2px; }
.meta b { font: 600 20px var(--font-mono); }
.progress { height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }

.keys { display: flex; gap: 8px; justify-content: center; }
.keys span {
  width: 72px; height: 84px; display: grid; place-items: center;
  background: var(--key); color: var(--key-ink); border-radius: 12px;
  font: 600 52px/1 var(--font-mono);
  box-shadow: inset 0 -5px 0 color-mix(in srgb, var(--key-ink) 18%, transparent);
}
.keys.pop span { animation: press .35s ease both; }
.keys.pop span:nth-child(2) { animation-delay: .05s; } .keys.pop span:nth-child(3) { animation-delay: .1s; }
@keyframes press { 40% { transform: translateY(3px); } }
.q { font: 600 20px/1.3 var(--font-display); margin: 0; text-align: center; text-wrap: balance; }
.hint { text-align: center; color: var(--muted); min-height: 1.5em; margin: 0; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opts button { font: 600 26px var(--font-mono); padding: 12px 0; border-radius: 10px; border: 1px solid var(--rule); background: var(--bg); color: var(--ink); cursor: pointer; }
.opts button:hover:not(:disabled) { border-color: var(--ink); }
.opts button.good { background: var(--good); border-color: var(--good); color: #fff; }
.opts button.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
.feedback { border-radius: 10px; padding: 10px 12px; margin: 0; font-weight: 500; }
.feedback.good { background: color-mix(in srgb, var(--good) 16%, transparent); }
.feedback.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { flex: 1; font: 600 14px var(--font-body); padding: 11px 14px; border-radius: 10px; border: 1px solid var(--rule); background: var(--bg); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--key); color: var(--key-ink); border-color: var(--key); }
.btn:disabled { opacity: .45; cursor: default; }
.seg { display: flex; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--ink); font: 600 13px var(--font-body); padding: 8px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.big { font: 800 56px/1 var(--font-display); text-align: center; margin: 0; font-variant-numeric: tabular-nums; }
.misses { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; max-height: 220px; overflow: auto; }
.misses li { display: flex; gap: 10px; align-items: baseline; }
.misses code, .codes code { font: 600 15px var(--font-mono); }
.codes { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px 12px; margin: 0; padding: 0; list-style: none; max-height: 340px; overflow: auto; }
.codes li { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
.codes li span { color: var(--muted); min-width: 0; }
.state-name { font: 800 28px/1.1 var(--font-display); margin: 0; }
.small { font-size: 13px; color: var(--muted); margin: 0; }
@media (max-width: 420px) { .keys span { width: 62px; height: 74px; font-size: 44px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
<style>:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>

<div class="wrap">
  <header>
    <div>
      <h1>Area Code Atlas <span>· 1-NPA</span></h1>
      <p class="sub">Learn where America's three-digit area codes ring. Most states are split into several area code regions, shown with dashed lines. Find the right region on the map, or pick the right code for a place.</p>
    </div>
    <div class="tabs" role="group" aria-label="Game mode">
      <button id="m-find" aria-pressed="true">Find the region</button>
      <button id="m-pick" aria-pressed="false">Pick the code</button>
      <button id="m-explore" aria-pressed="false">Explore</button>
    </div>
  </header>
  <div class="board">
    <div class="mapbox" id="mapbox">
      <div class="zoom" role="group" aria-label="Map zoom"><button id="z-us" aria-pressed="true">Whole map</button><button id="z-ne" aria-pressed="false">Zoom Northeast</button></div>
      <svg class="map" id="map" viewBox="0 0 1065 680" role="img" aria-label="Map of the United States"></svg>
      <div class="tip" id="tip" hidden></div>
    </div>
    <aside class="card" id="card" aria-live="polite"></aside>
  </div>
</div>

const CODES = [], codeMap = {};

const VB = { us: [0, 0, 1065, 680], ne: [690, 80, 340, 217] };
let vb = VB.us.slice(), zoomAnim;
function zoom(which) {
  document.getElementById("z-us").setAttribute("aria-pressed", which === "us");
  document.getElementById("z-ne").setAttribute("aria-pressed", which === "ne");
  svg.classList.toggle("zoomed", which === "ne");
  const from = vb.slice(), to = VB[which], t0 = performance.now();
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  cancelAnimationFrame(zoomAnim);
  const step = now => {
    const k = reduce ? 1 : Math.min(1, (now - t0) / 450), e = 1 - Math.pow(1 - k, 3);
    vb = from.map((v, i) => v + (to[i] - v) * e);
    svg.setAttribute("viewBox", vb.join(" "));
    if (k < 1) zoomAnim = requestAnimationFrame(step);
  };
  zoomAnim = requestAnimationFrame(step);
}
document.getElementById("z-us").onclick = () => zoom("us");

const ROUNDS = 10;
let mode = "find", pool = "major", state = {};
function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
pool = load("aca-pool") || "major";
const best = load("aca-best2") || {};

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function poolCodes() { return pool === "major" ? CODES.filter(c => c.major) : CODES; }
const stName = s => s === "District of Columbia" ? "DC" : s;
const where = c => `${c.city}, ${stName(c.state)}`;
const regionNames = c => c.regions.map(id => regMap[id]).filter(r => !r.one).map(r => r.n).join(" / ");

function newGame() {
  clearMarks();
  state = { qs: shuffle(poolCodes()).slice(0, ROUNDS), i: 0, score: 0, streak: 0, misses: [], phase: "ask", hint: false };
  ask();
}
function cur() { return state.qs[state.i]; }

function header() {
  const k = mode + "-" + pool;
  return `<div class="meta"><div><p class="label">Round</p><b>${Math.min(state.i + 1, ROUNDS)}/${ROUNDS}</b></div><div><p class="label">Score</p><b>${state.score}</b></div><div><p class="label">Streak</p><b>${state.streak}</b></div><div><p class="label">Best</p><b>${best[k] ?? "–"}</b></div></div>
  <div class="progress"><i style="width:${state.i / ROUNDS * 100}%"></i></div>`;
}
function poolSeg() {
  return `<div><p class="label" style="margin-bottom:6px">Codes to play</p><div class="seg" role="group" aria-label="Code set">
    <button id="p-major" aria-pressed="${pool === "major"}">Big cities (${CODES.filter(c => c.major).length})</button>
    <button id="p-all" aria-pressed="${pool === "all"}">All codes (${CODES.length})</button></div></div>`;
}
function bindPool() {
  card.querySelector("#p-major").onclick = () => { pool = "major"; save("aca-pool", pool); newGame(); };
  card.querySelector("#p-all").onclick = () => { pool = "all"; save("aca-pool", pool); newGame(); };
}
const keys = code => `<div class="keys pop" aria-label="Area code ${code}">${[...code].map(d => `<span>${d}</span>`).join("")}</div>`;

function ask() {
  clearMarks(true);
  state.phase = "ask"; state.hint = false;
  const c = cur();
  if (mode === "find") {
    card.innerHTML = `${header()}<p class="label" style="text-align:center">Incoming call from</p>${keys(c.code)}
      <p class="q">Where in the country does this area code ring?</p><p class="hint" id="hint">Click the right region of the right state. Right state but wrong region earns a few points.</p>
      <div class="row"><button class="btn" id="b-hint">Show city hint (½ points)</button><button class="btn" id="b-skip">Skip</button></div>${poolSeg()}`;
    card.querySelector("#b-hint").onclick = e => { state.hint = true; card.querySelector("#hint").textContent = `Hint: ${where(c)}`; e.target.disabled = true; };
    card.querySelector("#b-skip").onclick = () => answerFind(null);
  } else {
    mark(c.regions, "target");
    const taken = new Set(c.regions.flatMap(id => regMap[id].codes));
    const ok = x => !taken.has(x.code);
    const same = shuffle(CODES.filter(x => x.state === c.state && ok(x))).slice(0, 2);
    const used = new Set(same.map(x => x.code));
    const rest = shuffle(CODES.filter(x => x.state !== c.state && ok(x) && !used.has(x.code))).slice(0, 3 - same.length);
    const opts = shuffle([c, ...same, ...rest]);
    card.innerHTML = `${header()}<p class="label" style="text-align:center">Dialing</p>
      <p class="q">Which area code serves ${where(c)}?</p><p class="hint">The region is lit on the map. Watch out: some choices are from other parts of the same state.</p>
      <div class="opts">${opts.map(o => `<button data-c="${o.code}">${o.code}</button>`).join("")}</div>${poolSeg()}`;
    card.querySelectorAll(".opts button").forEach(b => b.onclick = () => answerPick(b));
  }
  bindPool();
}

function onRegion(id) {
  if (mode === "explore") return explore(id);
  if (mode === "find" && state.phase === "ask") answerFind(id);
}

function scoreRight(full) {
  const pts = full ? (state.hint ? 50 : 100) + Math.min(state.streak, 5) * 10 : (state.hint ? 15 : 30);
  state.score += pts;
  if (full) state.streak++; else state.streak = 0;
  return pts;
}
function answerFind(id) {
  const c = cur(); state.phase = "shown";
  const r = id ? regMap[id] : null;
  const right = r && r.codes.includes(c.code);
  const rn = regionNames(c);
  let msg;
  if (right) { mark(id, "good"); const p = scoreRight(true); msg = `<p class="feedback good">Correct. ${c.code} rings in ${where(c)}${rn ? ` (${rn})` : ""}. +${p}</p>`; }
  else if (r && r.s === c.state) {
    mark(id, "bad"); mark(c.regions, "target"); state.misses.push(c);
    const p = scoreRight(false);
    msg = `<p class="feedback bad">Right state, wrong part. ${r.n} uses ${r.codes.join(", ")}. ${c.code} covers ${rn || c.city}, in yellow. +${p}</p>`;
  } else {
    if (id) mark(id, "bad");
    mark(c.regions, "target"); state.streak = 0; state.misses.push(c);
    msg = `<p class="feedback bad">${r ? `Not ${r.s}. ` : ""}${c.code} is in ${where(c)}${rn ? ` (${rn})` : ""}, in yellow.</p>`;
  }
  showResult(msg, right);
}
function answerPick(btn) {
  const c = cur(); state.phase = "shown";
  const right = btn.dataset.c === c.code;
  card.querySelectorAll(".opts button").forEach(b => { b.disabled = true; if (b.dataset.c === c.code) b.classList.add("good"); });
  let msg;
  if (right) { clearMarks(true); mark(c.regions, "good"); const p = scoreRight(true); msg = `<p class="feedback good">Correct. ${c.city} answers on ${c.code}. +${p}</p>`; }
  else {
    btn.classList.add("bad"); state.streak = 0; state.misses.push(c);
    const w = codeMap[btn.dataset.c];
    mark(w.regions, "bad");
    const wn = regionNames(w);
    msg = `<p class="feedback bad">${w.code} belongs to ${wn ? wn + ", " + stName(w.state) : where(w)} (in red). ${c.city} uses ${c.code}.</p>`;
  }
  showResult(msg, right);

function showResult(msg, right) {
  card.querySelector(".meta").outerHTML = header().split('<div class="progress">')[0];
  card.querySelector(".hint").outerHTML = msg;
  const row = card.querySelector(".row");
  const nextHtml = `<div class="row"><button class="btn primary" id="b-next">${state.i + 1 >= ROUNDS ? "See results" : "Next call"}</button></div>`;
  if (row) row.outerHTML = nextHtml; else card.querySelector(".opts").insertAdjacentHTML("afterend", nextHtml);
  const next = card.querySelector("#b-next"); next.focus({ preventScroll: true });
  next.onclick = advance;
  if (right) state.timer = setTimeout(advance, 1500);
}
function advance() {
  clearTimeout(state.timer);
  if (state.phase !== "shown") return;
  const c = cur();
  clearMarks(true);
  if (!state.misses.includes(c)) mark(c.regions, "done");
  state.i++;
  if (state.i >= ROUNDS) finish(); else ask();
}
function finish() {
  state.phase = "over";
  const k = mode + "-" + pool, isBest = !(best[k] >= state.score);
  if (isBest) { best[k] = state.score; save("aca-best2", best); }
  const right = ROUNDS - state.misses.length;
  card.innerHTML = `<p class="label" style="text-align:center">Line closed</p><p class="big">${state.score}</p>
    <p class="q">${right} of ${ROUNDS} exactly right${isBest ? " · new best" : ""}</p>
    ${state.misses.length ? `<div><p class="label" style="margin-bottom:6px">Codes to review</p><ul class="misses">${state.misses.map(c => `<li><code>${c.code}</code><span>${regionNames(c) ? regionNames(c) + ", " + stName(c.state) : where(c)}</span></li>`).join("")}</ul></div>` : `<p class="small" style="text-align:center">A clean sweep.</p>`}
    <div class="row"><button class="btn primary" id="b-again">Play again</button><button class="btn" id="b-ex">Study the map</button></div>${poolSeg()}`;
  card.querySelector("#b-again").onclick = newGame;
  card.querySelector("#b-ex").onclick = () => setMode("explore");
  bindPool();
}

function explore(id) {
  clearMarks();
  const r = regMap[id];
  mark(id, "sel");
  const codes = r.codes.map(k => codeMap[k]);
  const others = regionsOf(r.s).filter(x => x.id !== id);
  const total = CODES.filter(c => c.state === r.s).length;
  card.innerHTML = `<p class="label">${ABBR[r.s]} · ${total} area code${total > 1 ? "s" : ""} in the state</p>
    <p class="state-name">${r.one ? r.s : r.n}</p>${r.one ? "" : `<p class="small">${r.s}</p>`}
    <ul class="codes">${codes.map(c => `<li><code>${c.code}</code><span>${c.city}</span></li>`).join("")}</ul>
    ${codes.length > 1 ? `<p class="small">These codes overlap: they all cover this same area, so neighbors can have different codes.</p>` : ""}
    ${others.length ? `<div><p class="label" style="margin-bottom:6px">Other parts of ${r.s}</p><ul class="others">${others.map(o => `<li><button data-go="${o.id}"><code>${o.codes.join(" ")}</code><span>${o.n}</span></button></li>`).join("")}</ul></div>` : ""}
    <p class="small">Region borders are approximate. Click any region on the map to study it.</p>`;
  card.querySelectorAll("[data-go]").forEach(b => b.onclick = () => explore(b.dataset.go));
}

function setMode(m) {
  mode = m; clearTimeout(state.timer);
  for (const id of ["find", "pick", "explore"]) document.getElementById("m-" + id).setAttribute("aria-pressed", id === m);
  if (m === "explore") { state = {}; explore(codeMap["713"].regions[0]); } else newGame();
}
document.getElementById("m-find").onclick = () => setMode("find");
document.getElementById("m-pick").onclick = () => setMode("pick");
document.getElementById("m-explore").onclick = () => setMode("explore");
newGame();
</script>

</body>
</html>
